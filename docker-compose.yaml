version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: staffsync_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: staffsync
    ports:
      - "3306:3306" 
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql 

  backend:
    build: 
      context: ./backend
    container_name: staffsync_backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db 
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=staffsync
      - DB_PORT=3306
    depends_on:
      - db
    volumes:
      - ./backend:/app 
  frontend:
    build:
      context: ./frontend/staffsync-frontend
    container_name: staffsync_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/staffsync-frontend:/app
      - /app/node_modules

volumes:
  mysql_data: